name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python3 -m pip install -r requirements_test.txt ruff==0.15.12
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
